# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: EDD on Grade Story Analysis

# Define prompts to test - template that includes base prompt
prompts:
  - file://../.devin/skills/grade-story-analysis/_tests/prompt.md

# External evaluation script for custom deterministic evaluations
# This script contains custom assertion functions used in tests
defaultTest:
  options:
    # ========================================
    # RUBRIC GRADER — NODE.JS (Cross-platform)
    # ========================================
    # Combined scripts auto-detect mode: provider vs grader
    # Grader mode: prompt is JSON array [{role, content}, ...]
    # Provider mode: prompt is plain text
    #
    # Devin CLI grader — ACTIVE
    provider: 'SWE 1.7 Medium'
    
# Use devin cli as a provider via script execution
providers:
  # ========================================
  # NODE.JS VERSIONS (Cross-platform)
  # ========================================
  # Combined scripts auto-detect mode: provider vs grader
  # Grader mode: prompt is JSON array [{role, content}, ...]
  # Provider mode: prompt is plain text
  #
  # Devin CLI provider — ACTIVE
  - id: 'exec: node ./devin.js'
    label: 'SWE 1.7 Medium'
    config:
      model: 'swe-1.7-medium'
  # - file://./stdProviders.config.yaml
  
# Test cases loaded from external file
tests: 
  - file://../.devin/skills/grade-story-analysis/_tests/base.tests.yaml
  - file://../.devin/skills/grade-story-analysis/_tests/incomplete-analysis.tests.yaml  
  - file://../.devin/skills/grade-story-analysis/_tests/scope-criteria.tests.yaml
  - file://../.devin/skills/grade-story-analysis/_tests/dependencies-quality.tests.yaml
  - file://../.devin/skills/grade-story-analysis/_tests/exemplary-score.tests.yaml
  - file://../.devin/skills/grade-story-analysis/_tests/robustness.tests.yaml

# Output configuration
outputPath: results.gradeAnalysis.html