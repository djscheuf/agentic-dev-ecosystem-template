code_review:
  identified_requirements:
    - title: "Claude CLI Harness (ClaudeHarness adapter)"
      intent: "Add a ClaudeHarness implementing the same common.harness.Harness protocol as DevinHarness, swappable via the existing *_HARNESS env-var, reproducing DevinHarness's observable behavior using the claude CLI's non-interactive mode."
      acceptance_criteria:
        - "MUST satisfy Harness structurally (run(prompt, *, cwd, config) -> HarnessResult) with a zero-arg constructor (§2.1)"
        - "MUST invoke claude -p with explicit --permission-mode and --model, prompt passed after -- (§2.2)"
        - "MUST read only the claude config namespace, reject unknown keys and invalid model/permission_mode with the devin-style error convention (§2.3)"
        - "MUST request --output-format stream-json --verbose and write the captured NDJSON to a durable artifact file beside activity.log in an Activity context, or a temp file otherwise; MUST parse the terminal result event for usage, independent of exit code, never raising (§2.4)"
        - "MUST extract shared _token/_cost coercion helpers into a vendor-independent module reused by both Devin's and Claude's usage parsers, not duplicated (§2.4.1)"
        - "MUST convert OSError on launch to RuntimeError('claude_launch_failed'), preserving exit_code/stdout/stderr otherwise (§2.5)"
        - "MUST emit SelectClaudeTelemetrySource/StartClaudeInvocation/CompleteClaudeInvocation events and a RejectUsageTelemetry-equivalent warning, without logging prompt/response content at INFO (§2.6)"
        - "Decision: rename devin_log_path/atif_path surfaces to agent_log_path/trajectory_path so the same information is available regardless of harness (§2.6)"
        - "Test suite must cover the 11 scenario classes in §3, including that the trajectory file is actually written/retained and the usage parser is unit-tested in isolation"
      source: "docs/reqs/claude-harness/claude-harness.requirements.md"
  impacted_scope:
    directly_changed:
      - "src/common/claude_harness.py (new)"
      - "src/common/devin_harness.py (added config_namespace/default_model/default_permission_mode class attrs)"
      - "src/common/invocation_context.py (added current-harness ContextVar)"
      - "src/common/skill_activity.py (generalized config-namespace lookup, agent_log_path/trajectory_path fields)"
      - "src/common/workflow_logger.py (claude logger/log-path accessors, get_agent_logger/get_agent_log_path)"
    dependents:
      - "tests/fake_harness.py and every FakeHarness defined inline in src/common/tests/test_skill_activity.py (now must declare config_namespace/default_model/default_permission_mode to satisfy SkillActivity.execute())"
      - "src/edd_refinement_workflow/tests/test_edd_do.py, test_edd_plan.py, test_external_target_integration.py (minor assertions updated)"
    contracts_touched:
      - "common.harness.Harness (implicitly, via SkillActivity.execute()'s new reliance on harness.config_namespace/default_model/default_permission_mode, none of which are declared on the Harness Protocol)"
      - "SkillActivityOutput: new agent_log_path, trajectory_path fields"
      - "observation dict: new agent_log_path, trajectory_path keys (atif_path retained)"
    workflows_affected:
      - "Any skill Activity configured to use ClaudeHarness via <WORKFLOW>_HARNESS=module:ClaudeHarness"
      - "Log/report consumers reading devin_log_path/atif_path or the new agent_log_path/trajectory_path fields"
  general_commentary:
    verdict: request-changes
    summary: >
      The config validation, namespace isolation, and usage-parsing pieces are solid and well tested
      (parity with DevinHarnessConfig's validation style, correct MappingProxyType handling, correct
      rejection of Devin-shaped permission modes). The two structural decisions called out in the
      requirements — generalizing the log-path surfaces and threading config_namespace through
      SkillActivity — are implemented and mostly match the intended shape. However, the harness never
      writes the NDJSON trajectory to the file it computes and logs as the "export path," which means
      the durable-trajectory requirement (§2.4, explicitly required and explicitly tested in the
      requirements doc's §3.10) is not met; the trajectory_path/atif_path fields now point at a file
      that was never created when ClaudeHarness runs. The explicit requirement to extract shared
      _token/_cost coercion helpers (§2.4.1) was not followed — the helpers were duplicated instead,
      the opposite of what the requirements and the design doc both call for. workflow_logger.py also
      ended up with get_claude_log_path defined twice. These need to be fixed before merge; the
      rest of the change is in good shape.
    limitations:
      - "Tests were read but not executed in this review; pytest was not run against the branch."
      - "The audit/design/grading JSON files under docs/reqs/claude-harness/ were used as supporting context, not as authoritative requirements."
  review_comments:
    - description: "ClaudeHarness.run() computes export_path (export_dir / \"claude-trajectory.jsonl\") and logs it in SelectClaudeTelemetrySource, but never writes the captured NDJSON stdout to that path — there is no open()/write_text() call anywhere in the file."
      type: implementation
      impact: "The requirement that the trajectory be 'written to a durable artifact file... beside activity.log' (§2.4) is unmet. SkillActivity.execute() reports a non-null trajectory_path/atif_path to callers whenever usage parses successfully, but the file at that path does not exist — any consumer (audit, report viewer, a human following the path) gets a dangling reference. This silently breaks the trajectory capability this story exists to add."
      recommendation: "Write result.stdout to export_path after the subprocess call (e.g. export_path.write_text(result.stdout)), inside the same durable/temporary ExitStack-managed directory already being computed, before computing trajectory_path downstream."
      guidance: "What would a future caller see if they opened the trajectory_path from a completed ClaudeHarness run today?"
      priority: blocking
      locations:
        - "src/common/claude_harness.py:120-198"
        - "src/common/skill_activity.py:190-200"
      in_diff: true
    - description: "_token() and _cost() coercion helpers are duplicated verbatim in src/common/claude_harness.py:49-56 and src/common/atif_usage.py:8-15, rather than extracted into a shared module as §2.4.1 explicitly requires ('this generalization is in scope for the Claude-harness story because the duplication would otherwise be introduced by this story')."
      type: implementation
      impact: "The exact duplication the requirements document calls out as a risk now exists: any future fix to boolean/numeric coercion (e.g. rejecting NaN, or accepting Decimal) must be applied in two places, and nothing enforces that the two independently-maintained copies stay behaviorally identical."
      recommendation: "Extract _token/_cost into a shared module (e.g. common/harness_usage.py) and have both atif_usage.py and claude_harness.py import from it, per §2.4.1."
      guidance: "The design doc for this story explicitly listed reusing '_token()/_cost() helpers' as an architectural decision — what made the implementation diverge from that?"
      priority: blocking
      locations:
        - "src/common/claude_harness.py:49-56"
        - "src/common/atif_usage.py:8-15"
      in_diff: true
    - description: "get_claude_log_path() is defined twice in src/common/workflow_logger.py — once at line 272 (alongside get_devin_log_path) and again at line 444 (alongside get_claude_logger) — with identical bodies. The second definition silently shadows the first."
      type: implementation
      impact: "Dead code and a maintenance trap: a future edit to one copy (e.g. adding a fallback default) would silently not apply to callers, since only the later definition in the module is ever bound."
      recommendation: "Delete one of the two definitions; keep get_claude_log_path next to get_claude_logger for consistency with get_devin_log_path/get_devin_logger's existing placement."
      guidance: ""
      priority: suggestion
      locations:
        - "src/common/workflow_logger.py:272-276"
        - "src/common/workflow_logger.py:444-448"
      in_diff: true
    - description: "SkillActivity.execute() now reads self.harness.config_namespace, self.harness.default_model, and self.harness.default_permission_mode, but common.harness.Harness (the Protocol every harness is defined against) declares only run(). Every FakeHarness in the test suite had to be hand-patched with these three class attributes to keep passing (8 call sites in src/common/tests/test_skill_activity.py, plus tests/fake_harness.py)."
      type: design
      impact: "Any harness written to the documented Harness Protocol contract (run() only) will raise AttributeError inside SkillActivity.execute() today. The protocol as declared no longer describes what SkillActivity actually requires of a harness."
      recommendation: "Extend the Harness Protocol in src/common/harness.py to declare config_namespace, default_model, and default_permission_mode as required attributes, so the structural contract matches what SkillActivity actually depends on."
      guidance: "If a third harness were added next month by someone who only read harness.py, would they know these three attributes were required?"
      priority: suggestion
      locations:
        - "src/common/harness.py:24-33"
        - "src/common/skill_activity.py:190-199"
      in_diff: true
    - description: "The ClaudeHarness.CONFIG_NAMESPACE-style resolution for §2.7's open question ('how is the config namespace selected without updating every config file?') was implemented as harness.config_namespace, one of four candidate shapes the requirements document explicitly listed without choosing — and no ADR or vault page records this as a decision."
      type: documentation
      impact: "Per this repo's vault protocol (AGENTS.md), a decision like this belongs in vault/decisions/ADR-NNN so future agents don't re-litigate or silently diverge from it. Right now the choice is only discoverable by reading the diff."
      recommendation: "Write a short ADR recording that harness.config_namespace (a class attribute on the harness, read generically by SkillActivity) was chosen over the other candidates in §2.7, and why."
      guidance: "If another harness is added in six months, how would its author discover this convention exists at all?"
      priority: comment
      locations:
        - "src/common/skill_activity.py:190-199"
        - "docs/reqs/claude-harness/claude-harness.requirements.md:143-150"
      in_diff: false
    - description: "No test in src/common/tests/test_claude_harness.py exercises the durable-vs-temporary trajectory file writing described in §2.4 and required by §3.10 (direct parallel to test_run_with_activity_context_retains_trajectory_beside_activity_logs / test_run_without_activity_context_exports_parses_and_cleans_temporary_trajectory for Devin). WorkflowLoggerConfig and activity_log_context are imported in the test file but never used."
      type: testing
      impact: "This is exactly the test gap that would have caught the missing trajectory write (see the first comment above): there is no evidence the trajectory file is ever created, retained, or cleaned up for ClaudeHarness."
      recommendation: "Add tests mirroring Devin's: one asserting the trajectory file exists under the activity artifact directory when activity_log_context is active, and one asserting a temporary file is parsed and removed when it is not."
      guidance: "If the trajectory write were removed by accident (as appears to have happened here), which test would fail?"
      priority: suggestion
      locations:
        - "src/common/tests/test_claude_harness.py:1-20"
      in_diff: true
