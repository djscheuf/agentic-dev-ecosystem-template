# ========================================
# INCOMPLETE Interface and Contracts
# ========================================
- vars:
    request:
      - '@../.devin/skills/grade-story-design/_tests/_data/truncated-badge.design.json'
    assert_config:
      expected_failing_sections:
        - "interface_contracts"
      score_floor: 0
      exact: true
  description: 'Missing Interface and Contracts'
  metadata:
    covers_test_case_ids:
      - "TC-012"
  assert:
    - type: javascript
      value: file://../.devin/skills/grade-story-design/_tests/gradeDesignChecks.js:hasExpectedFailingSections
      metric: interface-scores
      weight: 1
    - type: llm-rubric
      value: "The Interface and Contracts Section's Reason should mention missing or incomplete interface and contracts, such as endpoint definitions, payload shapes, or component props."
      threshold: 0.7
      metric: interface-reasons
      weight: 1
    - type: llm-rubric
      value: "The Interface and Contracts Section's Recommendation should include specifying interfaces and contracts explicitly. These may include endpoint definitions, payload shapes, and component props."
      threshold: 0.7
      metric: interface-recommendation
      weight: 1

# ========================================
# EXEMPLARY Interface and Contracts
# ========================================
- vars:
    request:
      - '@../.devin/skills/grade-story-design/_tests/_data/admin-tactic-types.design.json'
    assert_config:
      expected_failing_sections:
        - "interface_contracts"
      score_floor: 3
      exact: true
  description: 'Exemplary Interface and Contracts'
  metadata:
    covers_test_case_ids:
      - "TC-017"
  assert:
    - type: javascript
      value: file://../.devin/skills/grade-story-design/_tests/gradeDesignChecks.js:hasExpectedFailingSections
      metric: interface-scores
      weight: 1
    - type: llm-rubric
      value: "The Interface and Contracts Section's Reason should describe complete contract definitions (endpoints, payload shapes, component props, error handling) without naming any specific missing contract, unmapped workflow step, or shape mismatch as a deficiency."
      threshold: 0.7
      metric: interface-reasons
      weight: 1
    - type: llm-rubric
      value: "The Interface and Contracts Section's Recommendation should not identify any concrete gap or required change to the contracts. It may be empty, say no changes are needed, or offer only forward-looking advice to keep doing what the design already does."
      threshold: 0.7
      metric: interface-recommendation
      weight: 1

# ========================================
# SCRIPT-BASED DETERMINISTIC EVALUATIONS
# ========================================

- vars:
    request:
      - '@../.devin/skills/grade-story-design/_tests/_data/truncated-badge.design.json'
  description: 'Output Schema Validation - Script Based'
  metadata:
    covers_test_case_ids:
      - "TC-001"
  assert:
    - type: javascript
      value: file://./eval-script.js:matchesSchema
      config:
        schemaPath: '../.devin/skills/grade-story-design/schema/design-grade.schema.json'
